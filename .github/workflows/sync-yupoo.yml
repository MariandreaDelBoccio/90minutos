# Sincroniza el catálogo Yupoo (scrape + agrupado + curación) y publica en main.
name: Sync Yupoo

on:
  workflow_dispatch:
    inputs:
      max_pages:
        description: "Limite de paginas remotas (vacio = todas)"
        required: false
        default: ""
  schedule:
    # Lunes 06:00 UTC
    - cron: "0 6 * * 1"

permissions:
  contents: write

concurrency:
  group: sync-yupoo
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Sync Yupoo
        env:
          MAX_PAGES: ${{ github.event.inputs.max_pages }}
        run: |
          if [ -n "$MAX_PAGES" ]; then
            npm run sync-yupoo -- --max-pages "$MAX_PAGES"
          else
            npm run sync-yupoo
          fi

      - name: Commit si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/yupoo
          if git diff --staged --quiet; then
            echo "Sin cambios en el catalogo Yupoo."
            exit 0
          fi
          TOTAL=$(node -e "try{console.log(require('./data/yupoo/meta.json').total)}catch{console.log('?')}")
          git commit -m "chore: sync yupoo (${TOTAL} modelos)"
          git push
