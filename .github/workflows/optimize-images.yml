# Comprime y redimensiona fotos en assets/productos tras cada push.
# Si ya estan optimizadas, el job no hace commit (evita bucles sin [skip ci] en Netlify).
name: Optimizar imagenes

on:
  push:
    branches:
      - main
    paths:
      - "assets/productos/**"

permissions:
  contents: write

concurrency:
  group: optimize-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Saltar si es commit automatico del bot
        id: gate
        run: |
          msg="${{ github.event.head_commit.message }}"
          if [[ "$msg" == chore:\ optimizar\ imagenes* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Commit del bot; nada que optimizar."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Instalar dependencias
        if: steps.gate.outputs.skip != 'true'
        run: npm ci

      - name: Optimizar imagenes
        if: steps.gate.outputs.skip != 'true'
        run: npm run optimize-images

      - name: Commit si hay cambios
        if: steps.gate.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/productos
          if git diff --staged --quiet; then
            echo "Sin cambios tras optimizar."
            exit 0
          fi
          git commit -m "chore: optimizar imagenes de productos [skip ci]"
          git push
